<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style id="kanit-local">
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-BoldItalic.ttf') format('truetype'); font-weight: 700; font-style: italic; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-ExtraBold.ttf') format('truetype'); font-weight: 800; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-ExtraBoldItalic.ttf') format('truetype'); font-weight: 800; font-style: italic; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Black.ttf') format('truetype'); font-weight: 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-BlackItalic.ttf') format('truetype'); font-weight: 900; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-MediumItalic.ttf') format('truetype'); font-weight: 500; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-SemiBoldItalic.ttf') format('truetype'); font-weight: 600; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-BoldItalic.ttf') format('truetype'); font-weight: 700; font-style: italic; font-display: swap; }
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: rgb(250 246 239); padding: 24px; font-family: 'IBM Plex Sans', sans-serif; }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: rgb(1 118 211); margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
/* Variants */
.badge-default   { background: hsl(207 99% 42%); color: white; }
.badge-secondary { background: hsl(39 28% 90%); color: hsl(217 36% 17%); border-color: hsl(33 28% 85%); }
.badge-outline   { background: transparent; color: hsl(217 36% 17%); border-color: hsl(33 28% 85%); }
.badge-success   { background: rgb(235 243 219); color: rgb(40 80 15); }
.badge-warn      { background: rgba(245 224 157 / 0.5); color: rgb(93 63 41); }
.badge-danger    { background: hsl(0 51% 94%); color: hsl(0 51% 45%); }
.badge-navy      { background: hsl(212 71% 23%); color: hsl(38 100% 96%); }
.badge-primary-soft { background: hsl(211 100% 96%); color: hsl(207 99% 42%); border-color: hsl(207 99% 85%); }
/* Status dots */
.badge-dot { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid transparent; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
</style>
</head>
<body>
<div class="section-label">Badge Variants</div>
<div class="row">
  <span class="badge badge-default">Concluída</span>
  <span class="badge badge-secondary">Pendente</span>
  <span class="badge badge-outline">Sem skills</span>
  <span class="badge badge-success">+18% seguidores</span>
  <span class="badge badge-warn">30/60/90</span>
  <span class="badge badge-danger">Falha</span>
  <span class="badge badge-navy">evidence ledger</span>
  <span class="badge badge-primary-soft">deep link preservado</span>
</div>

<div class="section-label">Status Indicators</div>
<div class="row">
  <span class="badge-dot" style="background:rgb(235 243 219);color:rgb(40 80 15)"><span class="dot" style="background:rgb(152 184 88)"></span>Concluída</span>
  <span class="badge-dot" style="background:hsl(211 100% 96%);color:hsl(207 99% 42%)"><span class="dot" style="background:hsl(207 99% 42%)"></span>Processando</span>
  <span class="badge-dot" style="background:rgba(245 224 157 / 0.5);color:rgb(93 63 41)"><span class="dot" style="background:rgb(200 150 40)"></span>Aguardando</span>
  <span class="badge-dot" style="background:hsl(0 51% 94%);color:hsl(0 51% 45%)"><span class="dot" style="background:hsl(0 51% 51%)"></span>Falha</span>
</div>

<div class="section-label">Kicker Labels</div>
<div class="row">
  <span style="font-size:10px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:rgb(1 118 211)">Análise de Vídeo</span>
  <span style="color:rgb(227 217 205)">|</span>
  <span style="font-size:10px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:rgb(94 78 64)">Workspace</span>
  <span style="color:rgb(227 217 205)">|</span>
  <span style="font-size:10px;font-weight:600;letter-spacing:0.24em;text-transform:uppercase;color:hsl(38 80% 70%)">Sessão</span>
</div>
</body>
</html>
