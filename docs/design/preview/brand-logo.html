<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style id="kanit-local">
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-BoldItalic.ttf') format('truetype'); font-weight: 700; font-style: italic; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-ExtraBold.ttf') format('truetype'); font-weight: 800; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-ExtraBoldItalic.ttf') format('truetype'); font-weight: 800; font-style: italic; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Black.ttf') format('truetype'); font-weight: 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-BlackItalic.ttf') format('truetype'); font-weight: 900; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-MediumItalic.ttf') format('truetype'); font-weight: 500; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-SemiBoldItalic.ttf') format('truetype'); font-weight: 600; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-BoldItalic.ttf') format('truetype'); font-weight: 700; font-style: italic; font-display: swap; }
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: rgb(250 246 239); padding: 24px; font-family: 'IBM Plex Sans', sans-serif; }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: rgb(1 118 211); margin-bottom: 12px; }
.row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 20px; }
.logo-usage { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.logo-label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgb(94 78 64); }
.logo-wrap { display: flex; align-items: center; justify-content: center; }
.brand-lockup { display: flex; align-items: center; gap: 10px; }
.brand-name { font-family: 'Kanit', sans-serif; font-size: 20px; font-weight: 700; color: rgb(17 57 102); }
</style>
</head>
<body>
<div class="section-label">Logo Sizes</div>
<div class="row">
  <div class="logo-usage">
    <div class="logo-wrap"><img src="../assets/logo.png" style="width:24px;height:24px;object-fit:contain"></div>
    <div class="logo-label">24px</div>
  </div>
  <div class="logo-usage">
    <div class="logo-wrap"><img src="../assets/logo.png" style="width:40px;height:40px;object-fit:contain"></div>
    <div class="logo-label">40px</div>
  </div>
  <div class="logo-usage">
    <div class="logo-wrap"><img src="../assets/logo.png" style="width:56px;height:56px;object-fit:contain"></div>
    <div class="logo-label">56px</div>
  </div>
  <div class="logo-usage">
    <div class="logo-wrap"><img src="../assets/logo.png" style="width:80px;height:80px;object-fit:contain"></div>
    <div class="logo-label">80px</div>
  </div>
</div>

<div class="section-label">Logo + Wordmark Lockup</div>
<div class="row">
  <div style="background:rgb(255 252 247);border:1px solid rgb(227 217 205);border-radius:20px;padding:14px 20px">
    <div class="brand-lockup">
      <img src="../assets/logo.png" style="width:44px;height:44px;object-fit:contain;border-radius:12px">
      <div class="brand-name">Capyra</div>
    </div>
  </div>
  <div style="background:hsl(212 71% 23%);border-radius:20px;padding:14px 20px">
    <div class="brand-lockup">
      <div style="width:40px;height:40px;border-radius:12px;border:1px solid hsl(218 35% 28%);background:hsl(38 100% 96%);display:flex;align-items:center;justify-content:center;overflow:hidden">
        <img src="../assets/logo.png" style="width:32px;height:32px;object-fit:contain">
      </div>
      <div style="font-family:'Kanit',sans-serif;font-size:18px;font-weight:700;color:hsl(38 100% 96%)">Capyra</div>
    </div>
  </div>
</div>
</body>
</html>
