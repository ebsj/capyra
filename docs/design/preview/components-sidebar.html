<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style id="kanit-local">
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-BoldItalic.ttf') format('truetype'); font-weight: 700; font-style: italic; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-ExtraBold.ttf') format('truetype'); font-weight: 800; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-ExtraBoldItalic.ttf') format('truetype'); font-weight: 800; font-style: italic; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-Black.ttf') format('truetype'); font-weight: 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Kanit'; src: url('../fonts/Kanit-BlackItalic.ttf') format('truetype'); font-weight: 900; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-MediumItalic.ttf') format('truetype'); font-weight: 500; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-SemiBoldItalic.ttf') format('truetype'); font-weight: 600; font-style: italic; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../fonts/IBMPlexSans-BoldItalic.ttf') format('truetype'); font-weight: 700; font-style: italic; font-display: swap; }
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: hsl(38 52% 94%); display: flex; font-family: 'IBM Plex Sans', sans-serif; height: 340px; overflow: hidden; }
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: hsl(212 71% 23%);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  gap: 8px;
  border-right: 1px solid hsl(218 35% 22%);
}
.brand-block { background: hsl(216 44% 15% / 0.4); border-radius: 22px; border: 1px solid hsl(218 35% 28%); padding: 12px 14px; display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
.logo-box { width: 36px; height: 36px; border-radius: 12px; background: hsl(38 100% 96%); border: 1px solid hsl(218 35% 28%); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
.logo-box img { width: 28px; height: 28px; object-fit: contain; }
.brand-name { font-size: 9px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: hsl(38 80% 75%); }
.brand-user { font-family: 'Kanit', sans-serif; font-size: 14px; font-weight: 600; color: hsl(38 100% 96%); line-height: 1.2; }
.new-btn { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 14px; background: hsl(207 99% 42%); color: white; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; width: 100%; }
.divider { height: 1px; background: hsl(218 35% 28%); margin: 2px 0; }
.group-label { font-size: 9px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: hsl(38 60% 65%); padding: 6px 10px 2px; }
.nav-item { display: flex; flex-direction: column; padding: 8px 10px; border-radius: 14px; cursor: pointer; gap: 2px; }
.nav-item.active { background: hsl(207 99% 42% / 0.15); }
.nav-item:hover { background: hsl(216 44% 15%); }
.nav-row { display: flex; align-items: center; gap: 8px; }
.nav-label { font-size: 13px; font-weight: 500; color: hsl(38 100% 96%); }
.nav-desc { font-size: 10px; color: hsl(38 60% 70%); line-height: 1.4; }
.nav-icon { width: 16px; height: 16px; stroke: hsl(38 100% 86%); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.session-block { margin-top: auto; background: hsl(216 44% 15% / 0.3); border-radius: 20px; border: 1px solid hsl(218 35% 28%); padding: 12px 14px; }
.session-label { font-size: 9px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: hsl(38 60% 65%); }
.session-name { font-size: 13px; font-weight: 600; color: hsl(38 100% 96%); margin-top: 6px; }
.session-email { font-size: 11px; color: hsl(38 60% 70%); }
.badge-sm { display: inline-flex; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; background: hsl(207 99% 42% / 0.2); color: hsl(38 90% 90%); margin-top: 8px; }
.main { flex: 1; overflow: hidden; }
.top-bar { border-bottom: 1px solid hsl(33 28% 85%); background: hsl(38 52% 96% / 0.86); padding: 14px 20px; }
.eyebrow { font-size: 9px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: hsl(28 19% 45%); }
.page-title { font-family: 'Kanit', sans-serif; font-size: 22px; font-weight: 600; color: hsl(217 36% 17%); margin-top: 4px; }
.page-desc { font-size: 12px; color: hsl(28 19% 45%); margin-top: 3px; }
</style>
</head>
<body>
<nav class="sidebar">
  <div class="brand-block">
    <div class="logo-box"><img src="../assets/logo.png" alt="Capyra"></div>
    <div>
      <div class="brand-name">Capyra Web</div>
      <div class="brand-user">Ana Rodrigues</div>
    </div>
  </div>
  <button class="new-btn">
    <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Enviar arquivo
  </button>
  <div class="divider"></div>
  <div class="group-label">Superfícies</div>
  <div class="nav-item active">
    <div class="nav-row">
      <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span class="nav-label">Dashboard</span>
    </div>
    <span class="nav-desc">Leitura rápida e próximos passos.</span>
  </div>
  <div class="nav-item">
    <div class="nav-row">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="nav-label">Análises</span>
    </div>
    <span class="nav-desc">Histórico, filtros e acesso ao detalhe.</span>
  </div>
  <div class="session-block">
    <div class="session-label">Sessão</div>
    <div class="session-name">Ana Rodrigues</div>
    <div class="session-email">ana@agencia.co</div>
    <div class="badge-sm">Pro</div>
  </div>
</nav>
<div class="main">
  <div class="top-bar">
    <div class="eyebrow">Workspace</div>
    <div class="page-title">Painel de decisão</div>
    <div class="page-desc">Veja o que exige ação agora, o que já foi concluído e o melhor próximo movimento.</div>
  </div>
</div>
</body>
</html>
