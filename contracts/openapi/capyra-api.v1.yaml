      parameters:
      - name: X-Zernio-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - event
              properties:
                id:
                  type: string
                event:
                  type: string
              additionalProperties: true
      responses:
        '200':
          description: Persisted or duplicate event
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                required:
                - received
                additionalProperties: false
        '401':
          description: Invalid signature
        '400':
          description: Invalid event
        '413':
          description: Event too large
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FieldError:
      type: object
      required:
      - field
      - message
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type:
          - string
          - 'null'
        details:
          type:
          - object
          - 'null'
          additionalProperties: true
    ValidationErrorResponse:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - type: object
        required:
        - fieldErrors
        properties:
          fieldErrors:
            type: array
            items:
              $ref: '#/components/schemas/FieldError'
    RegisterRequest:
      type: object
      required:
      - displayName
      - accountType
      - ownerName
      - email
      - password
      properties:
        displayName:
          type: string
        accountType:
          type: string
          enum:
          - agency
          - creator
          - team
        ownerName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    UpdateAccountProfileRequest:
      type: object
      required:
      - displayName
      - accountType
      - ownerName
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        accountType:
          type: string
          enum:
          - agency
          - creator
          - team
        ownerName:
          type: string
          minLength: 2
          maxLength: 120
    FirebaseEmailLinkSignInRequest:
      type: object
      required:
      - idToken
      properties:
        idToken:
          type: string
        invitationToken:
          type: string
          minLength: 1
          maxLength: 256
    FirebaseSignInRequest:
      type: object
      required:
      - idToken
      properties:
        idToken:
          type: string
        invitationToken:
          type: string
          minLength: 1
          maxLength: 256
    AuthSessionResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresAt
      - user
      - account
      - brands
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AccountUserResponse'
        account:
          $ref: '#/components/schemas/AccountResponse'
        brands:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
    AccountResponse:
      type: object
      required:
      - id
      - displayName
      - accountType
      - createdAt
      - memberCount
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        accountType:
          type: string
          enum:
          - agency
          - creator
          - team
        createdAt:
          type: string
          format: date-time
        memberCount:
          type: integer
          minimum: 0
    AccountUserResponse:
      type: object
      required:
      - id
      - name
      - email
      - role
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - owner
          - member
        createdAt:
          type: string
          format: date-time
    OAuthAuthorizationCodeCreateRequest:
      type: object
      required:
      - clientId
      - redirectUri
      - codeChallenge
      - codeChallengeMethod
      properties:
        clientId:
          type: string
        redirectUri:
          type: string
          format: uri
        codeChallenge:
          type: string
        codeChallengeMethod:
          type: string
          enum:
          - S256
        scopes:
          type: array
          items:
            type: string
    OAuthAuthorizationCodeResponse:
      type: object
      required:
      - code
      - redirectUri
      - expiresAt
      properties:
        code:
          type: string
        redirectUri:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    OAuthDeviceCodeRequest:
      type: object
      required:
      - clientId
      properties:
        clientId:
          type: string
        scopes:
          type: array
          items:
            type: string
    OAuthDeviceActivationRequest:
      type: object
      required:
      - userCode
      properties:
        userCode:
          type: string
    OAuthDeviceCodeResponse:
      type: object
      required:
      - deviceCode
      - userCode
      - verificationUri
      - verificationUriComplete
      - expiresIn
      - interval
      - scope
      properties:
        deviceCode:
          type: string
        userCode:
          type: string
        verificationUri:
          type: string
          format: uri
        verificationUriComplete:
          type: string
          format: uri
        expiresIn:
          type: integer
          minimum: 1
        interval:
          type: integer
          minimum: 1
        scope:
          type: string
    OAuthTokenResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      - scope
      - user
      - account
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
        refresh_token:
          type: string
        scope:
          type: string
