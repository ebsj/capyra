openapi: 3.1.0
info:
  title: Capyra API
  version: v1
  description: 'Canonical Capyra API: analysis, account collaboration and Capyra Social.
    New analysis/upload requests require an explicit brandId, including CLI and MCP
    consumers. All provider identifiers remain private. Live social identity verification
    may block unsafe connections.'
servers:
- url: http://localhost:5080
security:
- bearerAuth: []
paths:
  /:
    get:
      security: []
      responses:
        '200':
          description: Service metadata.
  /health/live:
    get:
      security: []
      responses:
        '200':
          description: Live health.
  /health/ready:
    get:
      security: []
      responses:
        '200':
          description: Ready health.
  /api/v1/health:
    get:
      security: []
      responses:
        '200':
          description: Versioned health.
  /api/v1/auth/register:
    post:
      summary: Register with a local password for legacy API compatibility
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
  /api/v1/auth/login:
    post:
      summary: Sign in with a local password for legacy API compatibility
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
  /api/v1/auth/email-link:
    post:
      summary: Sign in and provision an account from a verified Firebase email link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseEmailLinkSignInRequest'
      responses:
        '200':
          description: Authenticated session for an existing or newly provisioned
            account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
  /api/v1/auth/firebase:
    post:
      summary: Sign in and provision an account from a verified Firebase identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseSignInRequest'
      responses:
        '200':
          description: Authenticated session for an existing or newly provisioned
            account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
  /api/v1/auth/account:
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountProfileRequest'
      responses:
        '204':
          description: Account profile updated.
  /api/v1/oauth/session:
    get:
      responses:
        '200':
          description: Describe the current OAuth-backed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthSessionResponse'
  /api/v1/oauth/authorization-codes:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizationCodeCreateRequest'
      responses:
        '200':
          description: Authorization code created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationCodeResponse'
  /api/v1/oauth/device/activate:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthDeviceActivationRequest'
      responses:
        '204':
          description: Device code approved by the authenticated user.
  /api/v1/oauth/device/code:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthDeviceCodeRequest'
      responses:
        '200':
          description: Device code created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthDeviceCodeResponse'
  /api/v1/oauth/token:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              properties:
                grant_type:
                  type: string
                client_id:
                  type: string
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                code_verifier:
                  type: string
                device_code:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: OAuth token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
  /api/v1/oauth/revoke:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRevokeRequest'
      responses:
        '204':
          description: Refresh token revoked.
  /api/v1/analysis-skills:
    get:
      summary: List currently published analysis skills
      description: Returns selectable skills for new analyses. The `compliance` id
        remains valid for historical analysis data but is not currently published
        for new analysis creation.
      responses:
        '200':
          description: Published analysis skill catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSkillCatalogResponse'
  /api/v1/source-assets:
    get:
      responses:
        '200':
          description: Reusable uploaded source assets for the authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAssetListResponse'
      parameters:
      - name: brandId
        in: query
        schema: &id001
          type: string
          format: uuid
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - brandId
              properties:
                file:
                  type: string
                  format: binary
                brandId: *id001
                variantOfAssetId: *id001
      responses:
        '201':
          description: Source asset created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAssetItem'
  /api/v1/source-assets/direct-uploads:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceAssetDirectUploadCreateRequest'
      responses:
        '200':
          description: Temporary Azure Blob upload URL created for a reusable source
            asset. The client uploads the binary directly to Blob Storage and then
            completes the source asset with JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAssetDirectUploadResponse'
  /api/v1/source-assets/direct-uploads/{sourceAssetId}/complete:
    post:
      parameters:
      - in: path
        name: sourceAssetId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceAssetDirectUploadCompleteRequest'
      responses:
        '201':
          description: Source asset created from a previously uploaded Blob object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAssetItem'
  /api/v1/integrations/source-asset-sessions:
    post:
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceAssetUploadSessionCreateRequest'
      responses:
        '200':
          description: Browser-mediated upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAssetUploadSessionResponse'
  /api/v1/integrations/source-asset-sessions/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Upload session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAssetUploadSessionResponse'
  /api/v1/integrations/source-asset-sessions/{id}/complete:
    post:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceAssetUploadSessionCompleteRequest'
      responses:
        '200':
          description: Upload session completed with a selected source asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAssetUploadSessionResponse'
  /api/v1/analyses:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CreateAnalysisFromUrlRequest'
              - $ref: '#/components/schemas/CreateAnalysisFromSourceAssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAnalysisUploadRequest'
      responses:
        '201':
          description: Analysis created in pending state. Processing continues asynchronously;
            poll GET /api/v1/analyses/{id} for completion or failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisDetailResponse'
        '422':
          description: Validation error when skills are empty, duplicated, invalid,
            or retained but unpublished such as `compliance`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    get:
      responses:
        '200':
          description: Account analysis history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisListResponse'
      parameters:
      - name: brandId
        in: query
        schema: *id001
  /api/v1/analyses/latest:
    get:
      summary: List latest analyses with conversational metadata.
      description: Returns the latest visible analyses for the authenticated account
        with count context, cursor pagination, flattened table fields, and optional
        presentation helpers. The raw GET /api/v1/analyses response remains unchanged.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - in: query
        name: cursor
        description: Opaque continuation cursor returned as nextCursor.
        schema:
          type: string
          nullable: true
      - in: query
        name: includeSummary
        schema:
          type: boolean
          default: true
      - in: query
        name: includeSkillDetails
        schema:
          type: boolean
          default: false
      - in: query
        name: includePresentation
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Latest analysis listing response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestAnalysisListResponse'
  /api/v1/analyses/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detailed analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisDetailResponse'
        '404':
          description: Not found.
    delete:
      responses:
        '204':
          description: Soft delete the analysis.
        '404':
          description: Not found.
  /api/v1/analyses/{id}/feedback-reactions/mine:
    get:
      summary: List current-user feedback reactions for one analysis.
      description: Returns only the first-party web session user's active reactions
        for eligible recommendation feedback items.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current-user reaction state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFeedbackReactionListResponse'
        '400':
          description: Analysis is not completed or has no generated report available
            for feedback reactions.
        '403':
          description: Request is not from a first-party authenticated web session.
        '404':
          description: Analysis not found.
  /api/v1/analyses/{id}/feedback-reactions/{feedbackItemKey}:
    put:
      summary: Create or update the current user's feedback for one AI feedback item.
      description: Upserts one active reaction and/or comment for the first-party
        web session user and feedback item.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: feedbackItemKey
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackReactionUpsertRequest'
      responses:
        '200':
          description: Feedback saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFeedbackReaction'
        '400':
          description: Invalid feedback item reference or unavailable analysis state.
        '403':
          description: Request is not from a first-party authenticated web session.
        '404':
          description: Analysis or feedback item not found.
        '422':
          description: Field validation error such as empty feedback or comment length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    delete:
      summary: Clear the current user's active reaction for one AI feedback item.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: feedbackItemKey
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '204':
          description: Reaction cleared or already absent.
        '400':
          description: Analysis is not available for feedback reactions.
        '403':
          description: Request is not from a first-party authenticated web session.
        '404':
          description: Analysis or feedback item not found.
  /api/v1/analyses/{id}/feedback-reactions/review:
    get:
      summary: Review tester feedback reactions for one analysis.
      description: Account-owner-only first-party web endpoint for reviewing contextual
        tester reactions and comments in the owner account.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: cursor
        schema:
          type: string
          nullable: true
      responses:
        '200':
          description: Owner-visible reaction review page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackReactionReviewResponse'
        '400':
          description: Invalid cursor.
        '403':
          description: Authenticated user is not an account owner or request is not
            first-party web.
        '404':
          description: Analysis not found.
  /api/v1/analyses/{id}/artifacts/{path}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Artifact stream.
        '404':
          description: Not found.
  /api/v1/brands:
    get:
      summary: GET /brands
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandListResponse'
        '401':
          description: Authentication required.
        '403':
          description: Role does not permit this operation.
        '422':
          description: Invalid input.
    post:
      summary: POST /brands
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          description: Authentication required.
        '403':
          description: Role does not permit this operation.
        '422':
          description: Invalid input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreateRequest'
  /api/v1/brands/{id}:
    patch:
      summary: PATCH /brands/{id}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          description: Authentication required.
        '403':
          description: Role does not permit this operation.
        '422':
          description: Invalid input.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdateRequest'
  /api/v1/brands/{id}/archive:
    post:
      summary: POST /brands/{id}/archive
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          description: Authentication required.
        '403':
          description: Role does not permit this operation.
        '422':
          description: Invalid input.
        '202':
          description: Waiting for confirmed cancellation and disconnection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/brands/{id}/restore:
    post:
      summary: POST /brands/{id}/restore
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          description: Authentication required.
        '403':
          description: Role does not permit this operation.
        '422':
          description: Invalid input.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/analyses/{id}/brand:
    patch:
      summary: PATCH /analyses/{id}/brand
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisDetailResponse'
        '401':
          description: Authentication required.
        '403':
          description: Role does not permit this operation.
        '422':
          description: Invalid input.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignAnalysisBrandRequest'
  /api/v1/members:
    get:
      summary: GET /members
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
  /api/v1/member-invitations:
    get:
      summary: GET /member-invitations
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitationListResponse'
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
    post:
      summary: POST /member-invitations
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitationCreateResponse'
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvitationCreateRequest'
  /api/v1/usage:
    get:
      summary: GET /usage
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
  /api/v1/notifications:
    get:
      summary: GET /notifications
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
      parameters:
      - name: cursor
        in: query
        schema: &id002
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
  /api/v1/audit-events:
    get:
      summary: GET /audit-events
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
      parameters:
      - name: cursor
        in: query
        schema: *id002
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
  /api/v1/source-assets/{id}:
    get:
      summary: GET /source-assets/{id}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAssetItem'
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
    delete:
      summary: DELETE /source-assets/{id}
      responses:
        '204':
          description: Success.
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /api/v1/member-invitations/accept:
    post:
      summary: POST /member-invitations/accept
      responses:
        '204':
          description: Success.
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvitationAcceptRequest'
  /api/v1/members/{id}:
    delete:
      summary: DELETE /members/{id}
      responses:
        '204':
          description: Success.
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /api/v1/member-invitations/{id}:
    delete:
      summary: DELETE /member-invitations/{id}
      responses:
        '204':
          description: Success.
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /api/v1/notifications/{id}/read:
    post:
      summary: POST /notifications/{id}/read
      responses:
        '204':
          description: Success.
        '401':
          description: Authentication required.
        '403':
          description: Operation forbidden for this member.
        '409':
          description: State, quota or idempotency conflict.
        '422':
          description: Invalid fields.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /api/v1/source-assets/{id}/content:
    get:
      summary: GET /source-assets/{id}/content
      responses:
        '200':
          description: Success.
          content: &id003
            application/octet-stream:
