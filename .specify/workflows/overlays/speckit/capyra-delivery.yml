id: capyra-delivery
extends: speckit
priority: 10
enabled: true
edits:
  # The full-cycle request authorizes these local stages. Decisions that remain
  # ambiguous still belong to the user; no deployment or publication is added.
  - remove: review-spec
  - remove: review-plan
  - insert_before: implement
    step:
      id: analyze
      command: speckit.analyze
      integration: "{{ inputs.integration }}"
      input:
        args: "{{ inputs.spec }}"
  - insert_after: implement
    step:
      id: converge
      command: speckit.converge
      integration: "{{ inputs.integration }}"
      input:
        args: "{{ inputs.spec }}"
