name: Cloudflare production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: capyra-production-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: latest
          enable-cache: true
      - run: npm ci
      - run: uv sync --directory apps/ai --frozen --group dev
      - run: npm run contracts:generate
      - name: Verify generated contracts are committed
        run: git diff --exit-code -- contracts/typescript/src
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check:cloudflare
      - run: uv run --directory apps/ai pytest

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CAPYRA_REQUIRE_ANALYSIS_SMOKE: ${{ vars.CAPYRA_REQUIRE_ANALYSIS_SMOKE }}
      CAPYRA_SMOKE_EMAIL: ${{ secrets.CAPYRA_SMOKE_EMAIL }}
      CAPYRA_SMOKE_PASSWORD: ${{ secrets.CAPYRA_SMOKE_PASSWORD }}
      CAPYRA_SMOKE_VIDEO_URL: ${{ secrets.CAPYRA_SMOKE_VIDEO_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy and smoke production
        run: ./infra/scripts/deploy-production.sh
